name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.2'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build --no-sources
      - run: uv run --locked twine check --strict dist/*
      - run: uv run --locked python scripts/check_distributions.py
      - name: Export locked test dependencies
        run: uv export --locked --no-emit-project --format requirements-txt --output-file test-requirements.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-requirements
          path: test-requirements.txt
          if-no-files-found: error

  test:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.2'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-requirements
      - name: Install the built wheel into a clean environment
        run: |
          uv venv .wheel-venv
          uv pip install --python .wheel-venv/bin/python --require-hashes -r test-requirements.txt
          uv pip install --python .wheel-venv/bin/python --no-deps dist/*.whl
      - name: Test the installed artifact
        run: |
          .wheel-venv/bin/python -m pytest -q
          .wheel-venv/bin/intryc-delivery --version
          .wheel-venv/bin/intryc-delivery validate examples/delivery --json

  passed:
    name: Checks passed
    if: always()
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all build and wheel checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$BUILD_RESULT" = success && test "$TEST_RESULT" = success
